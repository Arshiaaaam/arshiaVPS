name: Windows Cloud RDP

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0,5,10,15,20 * * *"

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    env:
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

    steps:

      # -------------------------
      # Enable Windows RDP
      # -------------------------
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0


      # -------------------------
      # Create RDP User
      # -------------------------
      - name: Create RDP User
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString `
            $Env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          if (Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "NvDAdmin"
          }

          New-LocalUser `
            -Name "NvDAdmin" `
            -Password $Password `
            -PasswordNeverExpires `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvDAdmin"


      # -------------------------
      # Install Tailscale
      # -------------------------
      - name: Install Tailscale
        shell: powershell
        run: |
          $Installer = "$env:TEMP\tailscale-setup.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$Installer`" /qn /norestart" `
            -Wait

          Start-Sleep -Seconds 10


      # -------------------------
      # Connect Tailscale
      # -------------------------
      - name: Connect Tailscale
        shell: powershell
        run: |
          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $Tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          $Hostname = "github-rdp-$($env:GITHUB_RUN_ID)"

          $Hostname = $Hostname.ToLower()
          $Hostname = $Hostname -replace '[^a-z0-9-]', ''
          $Hostname = $Hostname.Trim('-')

          Write-Host "Hostname: $Hostname"

          & $Tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="$Hostname" `
            --advertise-exit-node

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }


      # -------------------------
      # Verify Tailscale
      # -------------------------
      - name: Verify Tailscale
        shell: powershell
        run: |
          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "=============================="
          Write-Host "TAILSCALE STATUS"
          Write-Host "=============================="

          & $Tailscale status

          Write-Host ""
          Write-Host "=============================="
          Write-Host "TAILSCALE IP"
          Write-Host "=============================="

          & $Tailscale ip -4

          Write-Host ""
          Write-Host "=============================="
          Write-Host "TAILSCALE PREFS"
          Write-Host "=============================="

          & $Tailscale debug prefs


      # -------------------------
      # Keep Runner Alive
      # -------------------------
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Windows Runner is now active."
          Write-Host "Tailscale Exit Node is enabled."
          Write-Host "Runner ID: $env:GITHUB_RUN_ID"
          Write-Host "Keeping runner alive for 345 minutes..."

          for ($i = 1; $i -le 345; $i++) {
              Write-Host "[$i/345] Runner alive..."
              Start-Sleep -Seconds 60
          }
